<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>류난정 · 웹명함</title>

  <!-- CSS 연결 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <article class="card" aria-label="웹명함">
      <div class="top">
        <span class="eyebrow">PERSONAL BUSINESS CARD</span>
        <span class="mark" aria-hidden="true">✦</span>
      </div>

      <div class="portrait" id="portrait">
        <img src="./dog1.jpg" alt="프로필 사진">
      </div>

      <h1 id="cardName">류난정</h1>
      <p class="role" id="cardRole">게임 개발 PM 지망</p>

      <div class="rule"></div>

      <div class="contact">
        <a id="emailLink" href="mailto:hello@example.com">
          <span class="icon">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
          </span>

          <span>
            <span class="label">EMAIL</span>
            <span class="value" id="cardEmail">hello@example.com</span>
          </span>
        </a>

        <a id="phoneLink" href="tel:01012345678">
          <span class="icon">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 0 0-2 2c0 9 7 16 16 16a2 2 0 0 0 2-2v-3l-5-2-2 3a14 14 0 0 1-7-7l3-2-2-5Z"/>
            </svg>
          </span>

          <span>
            <span class="label">PHONE</span>
            <span class="value" id="cardPhone">010-1234-5678</span>
          </span>
        </a>
      </div>

      <div class="footer">LET’S CONNECT.</div>
    </article>

    <section class="tools" aria-label="명함 편집 도구">
      <div class="toolbar">
        <button
          id="editToggle"
          aria-expanded="false"
          aria-controls="editor"
        >명함 수정</button>

        <button id="download" class="primary">HTML 다운로드</button>
      </div>

      <p class="hint">
        내 정보와 사진을 입력하고 완성된 명함을 저장하세요.
      </p>

      <form id="editor" class="editor" hidden>
        <label class="field">
          이름
          <input id="nameInput" required maxlength="60" autocomplete="name">
        </label>

        <label class="field">
          직군
          <input id="roleInput" required maxlength="120">
        </label>

        <label class="field">
          이메일
          <input
            id="emailInput"
            type="email"
            required
            maxlength="254"
            autocomplete="email"
          >
        </label>

        <label class="field">
          전화번호
          <input
            id="phoneInput"
            type="tel"
            required
            maxlength="40"
            pattern="[+0-9\(\) .\-]{3,40}"
            autocomplete="tel"
          >
        </label>

        <p>
          기본 사진: HTML과 같은 폴더의 dog1.jpg.
          다른 사진은 아래에서 선택하세요.
        </p>

        <label class="field">
          프로필 이미지
          <input
            id="photoInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >
        </label>

        <p>
          JPG·PNG·WebP, 최대 10MB.
          사진은 이 브라우저에서 처리되며 저장한 HTML에 포함됩니다.
        </p>

        <div class="actions">
          <button class="primary" type="submit">정보 적용</button>
          <button type="button" id="removePhoto">사진 제거</button>
        </div>
      </form>

      <div
        class="status"
        id="status"
        role="status"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <!-- JavaScript 연결 -->
  <script src="script.js"></script>
</body>
</html>
