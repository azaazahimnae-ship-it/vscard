<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">

  <title>류난정 · 웹명함</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main>
    <article class="card" aria-labelledby="cardName">
      <!-- 원형 프로필 사진 -->
      <div class="portrait" id="portrait">
        <img src="./dog1.jpg" alt="류난정 프로필 사진">
      </div>

      <!-- 이름 및 직무 -->
      <h1 id="cardName">류난정</h1>
      <p class="role" id="cardRole">GAME DEVELOPMENT PM</p>

      <div class="rule" aria-hidden="true"></div>

      <!-- 연락처 -->
      <div class="contact">
        <a
          id="emailLink"
          href="mailto:rnj020117@gmail.com"
          title="클릭하여 이메일 주소 복사"
        >
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>
              <path d="m3 6 9 7 9-7"></path>
            </svg>
          </span>

          <span>
            <span class="label">EMAIL</span>
            <span class="value" id="cardEmail">rnj020117@gmail.com</span>
          </span>
        </a>

        <a id="phoneLink" href="tel:01072129874">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="
                M22 16.92v3
                a2 2 0 0 1-2.18 2
                19.79 19.79 0 0 1-8.63-3.07
                19.5 19.5 0 0 1-6-6
                19.79 19.79 0 0 1-3.07-8.67
                A2 2 0 0 1 4.11 2h3
                a2 2 0 0 1 2 1.72
                c.13.96.36 1.9.69 2.79
                a2 2 0 0 1-.45 2.11
                L8.09 9.91
                a16 16 0 0 0 6 6
                l1.27-1.27
                a2 2 0 0 1 2.11-.45
                c.89.33 1.83.56 2.79.69
                A2 2 0 0 1 22 16.92z
              "></path>
            </svg>
          </span>

          <span>
            <span class="label">PHONE</span>
            <span class="value" id="cardPhone">010-7212-9874</span>
          </span>
        </a>
      </div>

      <!-- script.js가 연락처 버튼 생성 -->
      <div
        id="contactActionButtons"
        class="contact-action-buttons"
      ></div>
    </article>

    <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
</body>
</html>
